<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trout Master: результати</title>
  <meta name="description" content="Онлайн-результати Trout Master. Оновлюються автоматично під час змагань.">
  <meta name="theme-color" content="#080808">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101828'/%3E%3Cpath d='M15 17h34v9H37v23H27V26H15z' fill='%23fff'/%3E%3Crect x='15' y='53' width='34' height='4' rx='2' fill='%2376b11d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <script src="config.js"></script>
  <script>
    // Запитуємо результати одразу, паралельно з завантаженням решти сторінки
    (function () {
      try {
        var u = String((window.RESULTS_CONFIG || {}).API_URL || '').trim() || 'demo.json';
        window.__tmEarly = fetch(u + (u.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); return r.json(); });
        window.__tmEarly.catch(function () {});
      } catch (e) { window.__tmEarly = null; }
    })();
  </script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <img class="logo" src="assets/logo.svg" width="962" height="271" alt="Trout Master">
      <span class="status" id="status" data-state="load" role="status" aria-live="polite">
        <span class="status__dot" aria-hidden="true"></span>
        <span id="statusText">Завантаження…</span>
      </span>
    </div>
  </header>

  <main class="wrap main">
    <div class="intro">
      <h1 class="title" id="title">Результати</h1>
      <p class="subtitle" id="subtitle" hidden></p>
    </div>

    <div class="notice" id="notice" role="note" hidden></div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Таблиці"></div>

    <p class="info" id="info">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.25"/><path d="M10 9v5"/><circle cx="10" cy="6.25" r="0.6" class="dot"/></svg>
      <span>Торкніться рядка, щоб виділити учасника. Результати оновлюються автоматично.</span>
    </p>

    <section class="board" id="board" role="tabpanel" aria-label="Таблиця результатів"></section>
  </main>

</body>
</html>
