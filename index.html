<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Результати змагань</title>
  <meta name="description" content="Онлайн-результати змагань з ловлі форелі. Оновлюються автоматично під час турніру.">
  <meta name="theme-color" content="#2f4b3d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 32c8-12 22-17 36-12l10-8v40l-10-8C28 49 14 44 6 32z' fill='%232f4b3d'/%3E%3Cpath d='M10 33c10 3 22 4 34 0' stroke='%23d6466f' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='15' cy='29' r='2.5' fill='%23f1f4ee'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/unbounded-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <script src="config.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead__inner">
      <div class="brandline">
        <span class="brand" id="brand">Trout Master</span>
        <span class="status" id="status" data-state="load" role="status" aria-live="polite">
          <span class="status__dot" aria-hidden="true"></span>
          <span id="statusText">Завантаження…</span>
        </span>
      </div>
      <h1 class="title" id="title">Результати</h1>
      <p class="subtitle" id="subtitle" hidden></p>
    </div>
    <div class="lateral" aria-hidden="true"></div>
  </header>

  <main class="wrap main">
    <div class="notice" id="notice" hidden></div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Залік"></div>

    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span class="visually-hidden">Пошук</span>
        <input id="q" type="search" placeholder="Знайти учасника" autocomplete="off" spellcheck="false">
      </label>
      <div class="groups" id="groups" role="group" aria-label="Що показати" hidden></div>
    </div>

    <p class="hint" id="hint" hidden>Торкніться імені, щоб стежити за учасником. Його рядок закріпиться над таблицею.</p>

    <section class="board" id="board" aria-label="Таблиця результатів"></section>
    <div class="notes" id="notes"></div>
  </main>

  <footer class="wrap foot">
    <p>Результати надходять із таблиці суддів і оновлюються на сторінці самі.</p>
  </footer>
</body>
</html>
