<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fixel;src:url(../fonts/fixel-cyrillic-var.woff2) format('woff2');font-weight:100 900;unicode-range:U+0400-04FF}
@font-face{font-family:Fixel;src:url(../fonts/fixel-latin-var.woff2) format('woff2');font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0a0a0a;font-family:Fixel;color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;right:-220px;top:-260px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(118,177,29,.30),rgba(118,177,29,0) 62%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(90deg,transparent,#000 60%)}
.in{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
.logo{width:430px}
.live{margin-top:auto;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:10px 20px;border-radius:999px;background:rgba(118,177,29,.14);color:#a6dc4f;font-size:24px;font-weight:650}
.live i{width:12px;height:12px;border-radius:50%;background:#76b11d;box-shadow:0 0 0 6px rgba(118,177,29,.22)}
h1{margin-top:22px;font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-1.5px}
p{margin-top:20px;font-size:28px;color:#a3abb8;font-weight:500}
.dom{position:absolute;right:80px;bottom:72px;font-size:26px;font-weight:650;color:#fff;opacity:.9}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="in"><img class="logo" src="../logo.svg"><span class="live"><i></i>Наживо</span>
<h1>Результати онлайн</h1><p>Таблиця · тури · картки учасників · статистика</p></div>
<span class="dom">troutmaster.app</span></body></html>
